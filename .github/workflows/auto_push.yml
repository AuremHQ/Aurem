name: Force sync preview to main

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # This workflow does NOT deploy anything. It used to POST a
      # "success" deploy report to auremcto.com on every push to main even
      # though nothing was deployed, which made the dashboard claim a
      # deploy that never happened. Real deploy results are reported only
      # by AUREM Auto-Deploy (after approval, with the real hook result).
      - name: Verify build
        run: |
          echo "Build verified at $(date)"
          echo "Commit: ${{ github.sha }}"
          echo "No deploy is performed or reported by this workflow."
