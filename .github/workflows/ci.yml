name: AUREM CI — Build + Test Guard

on:
  # Iter 309 · Phase 0.2 — CI trigger reality check (round 2).
  # Round 1 (iter 306) fixed quality-gate.yml's on: to include
  # `push: branches: **`. This workflow (ci.yml) was NOT updated at
  # the same time — it kept `push: branches: [main, master, dev,
  # staging]` which meant no feature branch push (e.g. Emergent's
  # Save-to-GitHub picking any custom branch) ever triggered the
  # backend pytest job. Founder pushed `phase-0.2-canary` to prove
  # CI failure propagation; ci.yml never fired because the branch
  # name didn't match the whitelist. Symmetry with quality-gate.yml
  # restored below.
  push:
    branches:
      - '**'
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  frontend-build:
    name: Frontend — Build check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile || { echo "::warning::yarn.lock out of sync in repo - falling back to yarn install"; yarn install; }

      - name: Build check
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: https://aurem.live
          CI: "false"
        run: |
          yarn build 2>&1 | tee /tmp/build_output.txt
          if grep -iE "error TS|SyntaxError|Module not found|Failed to compile|Parsing error" /tmp/build_output.txt; then
            echo "❌ BUILD FAILED — broken code detected"
            exit 1
          fi
          echo "✅ Build passed"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-log
          path: /tmp/build_output.txt
          retention-days: 7

      # 2026-08-27 · Guard 4 — rendered-page secret scan (Iter 362).
      # Scans the ACTUAL build that's about to ship (via `yarn preview`,
      # the same production-bundle server Lighthouse CI already boots
      # for Core Web Vitals — see quality-gate.yml), not stale
      # production. Blocks only on a VERIFIED real-secret-shaped match
      # (see PATTERNS/ALLOWLIST_SUBSTRS in the script) — same bar as
      # trufflehog, no heuristic/false-positive blocking. stdlib-only,
      # no new dependency.
      - name: Guard 4 — rendered-page secret scan
        working-directory: frontend
        run: |
          yarn preview > /tmp/preview.log 2>&1 &
          PREVIEW_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/ >/dev/null 2>&1 && break
            sleep 1
          done
          cd ../backend
          python3 scripts/g4_secret_scanner.py --base-url http://localhost:3000
          EXIT=$?
          kill "$PREVIEW_PID" 2>/dev/null || true
          if [ "$EXIT" -ne 0 ]; then
            echo "::error::Guard 4 found a real secret in rendered output — see log above"
          fi
          exit $EXIT


  backend-tests:
    name: Backend — pytest (shard ${{ matrix.shard }}/4)
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    # 2026-09-29 · CI-trustworthiness audit — this job used to run the
    # WHOLE suite in one step and reliably hit this timeout (see the
    # 20→10 history above the pre-split version of this comment): the
    # real cause was 98 test files making live `requests.*` calls to
    # REACT_APP_BACKEND_URL that fell through to the file committed in
    # frontend/.env (a real, reachable deployment) instead of being
    # skipped — see the REACT_APP_BACKEND_URL override below and
    # backend/tests/live_env_quarantine.txt. Fixing that took the
    # whole suite from >15min (killed, never finished) to ~7.5min
    # total. Sharded 4 ways below anyway so a slow week of new tests
    # doesn't silently reintroduce the same failure mode — each shard
    # now has ~9x headroom under its own 10-minute cap instead of 0.
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    services:
      mongodb:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: aurem_test
      JWT_SECRET: ci-test-secret-32-chars-minimum!!
      OPENROUTER_API_KEY: sk-test-not-real
      EMERGENT_LLM_KEY: test-not-real
      AUREM_MASTER_KEY: ci-test-master-key-32-chars-long!!
      REDIS_URL: ""
      DISABLE_UPSTREAM_TOOLS: "1"
      ENABLE_EVAL_CRON: "0"
      APP_URL: http://localhost:8001
      PYTHONDONTWRITEBYTECODE: "1"
      CI: "true"
      DISABLE_LOGIN_RATE_LIMIT: "true"
      # 2026-09-29 — root cause of the 15-minute timeout (see job
      # comment above). This job never boots a server, so it must
      # never resolve to one either: a guaranteed-refused loopback
      # address makes every live_env-quarantined test's reachability
      # probe fail in <1s instead of falling through to whatever real
      # URL happens to be committed in frontend/.env.
      REACT_APP_BACKEND_URL: http://127.0.0.1:1

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Phase 0 coverage-ratchet guard below needs a real base..head
          # diff range, not a 1-commit shallow clone.
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # 2026-08-27 — fail-fast dependency resolution check. Catches a
      # broken requirements.txt (e.g. a version conflict between a
      # direct pin and a transitive requirement — exactly what happened
      # with the litellm/emergentintegrations conflict) in seconds, with
      # an unambiguous "resolution is broken" signal, instead of only
      # discovering it minutes later as an ambiguous "install step
      # failed" from inside the retry loop below (which can't tell a
      # permanent ResolutionImpossible apart from a transient network
      # blip — it just retries a doomed install 3 times either way).
      - name: Dependency resolution check (fail-fast)
        working-directory: backend
        run: |
          pip install --dry-run --no-cache-dir -r requirements.txt \
            --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/ \
            || { echo "::error::requirements.txt does not resolve — fix the conflict before pushing (see the pip error above for the exact clashing packages)."; exit 1; }

      - name: Install dependencies
        working-directory: backend
        run: |
          # Iter 306 — emergentintegrations lives on Emergent's private
          # index (not on public PyPI), so GH-hosted runners need the
          # --extra-index-url to resolve it.
          # 2026-08-26 — CI Retry mechanism (infra-flake only, scoped):
          # network installs get 3 attempts w/ backoff. This never
          # touches test assertions — see the `--only-rerun` regex on
          # the "Run tests" step below for that half of the mechanism.
          for attempt in 1 2 3; do
            pip install --no-cache-dir -r requirements.txt \
              --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/ \
              pytest pytest-asyncio pytest-cov pytest-timeout pytest-rerunfailures pytest-split httpx --quiet \
              && break
            echo "::warning::pip install attempt $attempt failed — retrying in $((attempt * 5))s"
            [ "$attempt" -eq 3 ] && exit 1
            sleep $((attempt * 5))
          done

      # 2026-08-25 — services/loop_verify.py shells out to `ruff`/`eslint`
      # for the loop's real static-analysis step, with a documented
      # graceful "skip" fallback when a binary is missing (Iter 212m-166,
      # so production never crashes over it). Neither binary was ever
      # installed on this runner, so test_iter212m62_loop_verify.py's
      # linter-outcome assertions always saw "skip" here — a CI-tooling
      # gap, not an app bug. Matching install now added so the runner
      # can exercise the real linter path like the pod does.
      - name: Install ruff + eslint (for loop_verify tests)
        run: |
          pip install --quiet ruff
          npm install -g eslint@8 --quiet

      - name: Map workspace to /app (legacy hardcoded test paths)
        run: sudo ln -sfn "$GITHUB_WORKSPACE" /app

      - name: Guard 18 — universal timeout audit (Iter 359)
        working-directory: backend
        run: python scripts/timeout_audit.py

      - name: Guard 21 — OWASP/CWE misconfig + supply-chain scan (Iter 361)
        working-directory: backend
        run: python scripts/g21_security_scan.py

      - name: Iter 364 — Pricing copy truth gate
        working-directory: backend
        run: python scripts/pricing_copy_lint.py

      - name: Run tests (shard ${{ matrix.shard }} of 4)
        working-directory: backend
        run: |
          # Iter 309 · Phase 0.2 · Round 6 — CAPTURE pytest exit code
          # IMMEDIATELY. Round 5 added a grep-based canary-proof block
          # AFTER the pytest pipe and BEFORE `exit ${PIPESTATUS[0]}`,
          # which clobbered PIPESTATUS to point at the grep (always 0
          # when the canary line is present) instead of pytest.
          # Result: every failing pytest run showed the step as GREEN
          # because $? by the time exit ran was zero. Classic
          # bash-pipe exit-code trap. `set -o pipefail` also enabled
          # as belt-and-braces so the `2>&1 | tee` pipe returns the
          # left-hand exit code by default.
          set -o pipefail
          # 2026-09-29 — was one un-sharded run of the whole suite with
          # `timeout -s INT 15m` as the last-resort guard against the
          # job's own timeout-minutes killing it silently. Now 4
          # parallel shards (pytest-split, --splits/--group below;
          # .test_durations.json committed alongside this file so the
          # split is time-balanced, not just equal-count) — each shard
          # keeps the same SIGINT-before-job-timeout safety net, just
          # scaled down to match its own much smaller 12-minute job
          # budget. Still a failing step (exit 124) if a shard's
          # timeout is ever hit again.
          # GitHub's default `bash -e` aborts on the failing pipeline below,
          # so on any red shard the exit-code capture and the coverage `mv`
          # never ran and no coverage-shard artifact existed. +e until captured.
          set +e
          timeout -s INT 8m python -m pytest \
            --splits 4 --group ${{ matrix.shard }} \
            --splitting-algorithm least_duration \
            --tb=short \
            --timeout=30 \
            --durations=30 \
            -q \
            --cov=. \
            --cov-report= \
            --continue-on-collection-errors \
            --reruns 1 --reruns-delay 3 \
            --only-rerun "ConnectionError|ConnectionRefusedError|TimeoutError|RemoteDisconnected|ConnectionResetError" \
            --ignore=tests/test_iter138_acceptance_seven.py \
            --ignore=tests/test_iter212m163_aggression_chat.py \
            2>&1 | tee /tmp/pytest_output.txt
          PYTEST_EXIT=${PIPESTATUS[0]}
          set -e
          echo "Pytest exit code (captured immediately): $PYTEST_EXIT"
          if [ "$PYTEST_EXIT" = "124" ]; then
            echo "::error::pytest hit shard ${{ matrix.shard }}/4's 8-minute cap — see the 'slowest durations' block above."
          fi
          # Coverage combine below (aggregate job) needs one uniquely
          # named file per shard — plain `.coverage` would collide
          # once all 4 shards' artifacts land in the same directory.
          mv .coverage ".coverage.shard${{ matrix.shard }}" 2>/dev/null || true

          # Exit with pytest's exit code (captured before any post-processing).
          exit "$PYTEST_EXIT"

      - name: Summarise failing tests (shard ${{ matrix.shard }})
        # `if: always()` so it runs after a red "Run tests"; puts the failing
        # test ids in the job summary, which the API can read (the raw log tail
        # is buried under service-container noise).
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "### Failing / erroring tests — shard ${{ matrix.shard }}/4"
            if [ -f /tmp/pytest_output.txt ]; then
              grep -E '^(FAILED|ERROR) ' /tmp/pytest_output.txt | sort -u | head -200 || true
              tail -n 1 /tmp/pytest_output.txt
            else
              echo "no pytest output captured"
            fi
          } > /tmp/failing_summary.md
          cat /tmp/failing_summary.md >> "$GITHUB_STEP_SUMMARY"
          # The job summary is not readable through the API, so on PR runs also
          # post the list as a comment.
          if [ -n "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/failing_summary.md || true
          fi

      - name: Upload shard test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-shard-${{ matrix.shard }}
          path: /tmp/pytest_output.txt
          retention-days: 7

      - name: Upload shard coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: backend/.coverage.shard${{ matrix.shard }}
          retention-days: 1
          # upload-artifact@v4 skips dotfiles by default; without this the
          # artifact is silently empty and the ratchet gets no coverage input.
          include-hidden-files: true
          if-no-files-found: ignore


  # 2026-09-29 · CI-trustworthiness audit — split off backend-tests
  # above (see that job's header comment for why). Everything here
  # used to be later steps of that same job; unchanged other than
  # reading MERGED inputs from all 4 shards instead of one job's own
  # /tmp/pytest_output.txt / backend/coverage.json. deploy-gate's
  # needs: list below was updated to depend on this job too — these
  # guards are required checks, not advisory, and must keep blocking
  # deploy exactly like they did as steps inside backend-tests.
  backend-tests-aggregate:
    name: Backend — pytest (guards, merged across shards)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend-tests]
    if: always()

    services:
      mongodb:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: aurem_test
      JWT_SECRET: ci-test-secret-32-chars-minimum!!
      OPENROUTER_API_KEY: sk-test-not-real
      EMERGENT_LLM_KEY: test-not-real
      AUREM_MASTER_KEY: ci-test-master-key-32-chars-long!!
      REDIS_URL: ""
      DISABLE_UPSTREAM_TOOLS: "1"
      ENABLE_EVAL_CRON: "0"
      APP_URL: http://localhost:8001
      PYTHONDONTWRITEBYTECODE: "1"
      CI: "true"
      DISABLE_LOGIN_RATE_LIMIT: "true"
      REACT_APP_BACKEND_URL: http://127.0.0.1:1

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          for attempt in 1 2 3; do
            pip install --no-cache-dir -r requirements.txt \
              --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/ \
              pytest pytest-asyncio pytest-cov pytest-timeout pytest-rerunfailures pytest-split httpx --quiet \
              && break
            echo "::warning::pip install attempt $attempt failed — retrying in $((attempt * 5))s"
            [ "$attempt" -eq 3 ] && exit 1
            sleep $((attempt * 5))
          done

      - name: Map workspace to /app (legacy hardcoded test paths)
        run: sudo ln -sfn "$GITHUB_WORKSPACE" /app

      - name: Download all shard test-result artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pytest-results-shard-*
          path: /tmp/shard-results

      - name: Download all shard coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-shard-*
          path: backend
          merge-multiple: true

      - name: Merge shard outputs (pytest_output.txt + coverage.json)
        working-directory: backend
        run: |
          # Regression baseline lock (below) counts FAILED/ERROR lines
          # in this file — a plain concatenation across the 4 shards'
          # own /tmp/pytest_output.txt is exactly right, no special
          # merge logic needed for that guard.
          cat /tmp/shard-results/pytest-results-shard-*/pytest_output.txt > /tmp/pytest_output.txt 2>/dev/null || true
          echo "--- merged $(grep -cE '^(FAILED|ERROR) ' /tmp/pytest_output.txt || echo 0) failed/errored lines across 4 shards ---"

          # Coverage ratchet (below) needs one real, full-repo
          # coverage.json — `coverage combine` merges the 4 shards'
          # .coverage.shard* SQLite files (standard parallel-coverage
          # pattern), then `coverage json` renders it same as the
          # single-job version always did.
          # A stale tracked backend/.coverage must never stand in for the
          # shards: coverage json falls back to it and dies on missing sources.
          rm -f .coverage
          python -m coverage combine .coverage.shard1 .coverage.shard2 .coverage.shard3 .coverage.shard4 2>&1 || echo "::warning::coverage combine had issues — ratchet guard below may see partial data"
          python -m coverage json -o coverage.json 2>&1 || echo "::warning::coverage json render failed"

      - name: Guard — Coverage ratchet + touched-file floor (Phase 0)
        # 2026-08 founder directive — runs even if a shard above
        # failed for pre-existing/unrelated reasons (same if: always()
        # pattern as the Legacy lane step below) so this guard's own
        # signal is never silently swallowed by the wider red suite.
        if: always()
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          set -e
          if [ "$EVENT" = "pull_request" ]; then
            git fetch origin "$BASE_REF" --depth=50 || true
            BASE_SHA="origin/$BASE_REF"
            HEAD_SHA="HEAD"
          else
            if [ -z "$BEFORE" ] || echo "$BEFORE" | grep -q '^0*$'; then
              BASE_SHA="HEAD~1"
            else
              BASE_SHA="$BEFORE"
            fi
            HEAD_SHA="$SHA"
          fi
          OVERRIDE=""
          if [ "$EVENT" = "pull_request" ] && printf '%s' "$PR_LABELS" | grep -q '"coverage-approved"'; then
            OVERRIDE="--override"
          elif git log -1 --format=%B "$HEAD_SHA" | grep -q '\[coverage-approved\]'; then
            OVERRIDE="--override"
          fi
          echo "Diffing $BASE_SHA..$HEAD_SHA (override: ${OVERRIDE:-none})"
          python backend/scripts/ci_check_coverage_ratchet.py "$BASE_SHA" "$HEAD_SHA" backend/coverage.json $OVERRIDE

      - name: Guard — Regression baseline lock (Fix 3, hardening)
        # 2026-08 hardening — stricter than the coverage ratchet's
        # touched-file floor above: blocks deploy if the suite's
        # TOTAL failed/errored count goes UP versus the locked
        # baseline in backend/tests/baseline_counts.txt, so a new
        # regression anywhere in the suite can't hide inside the
        # pre-existing red. if: always() — same reasoning as the
        # ratchet guard above, this signal must never be swallowed
        # by an unrelated shard failure.
        if: always()
        env:
          EVENT: ${{ github.event_name }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          set -e
          OVERRIDE=""
          if [ "$EVENT" = "pull_request" ] && printf '%s' "$PR_LABELS" | grep -q '"regression-approved"'; then
            OVERRIDE="--override"
          elif git log -1 --format=%B HEAD | grep -q '\[regression-approved\]'; then
            OVERRIDE="--override"
          fi
          python backend/scripts/ci_check_regression_baseline.py /tmp/pytest_output.txt $OVERRIDE

      - name: Raw exception leak check (Guard 22, Phase 2.3)
        # 2026-08-24 — real, AST-based, CI-enforced check that a raw
        # Python exception message never flows into a customer-facing
        # sink (task step log, chat reply) without going through
        # services.error_classifier.classify_error() first. This is
        # the exact bug class behind the ReRootsBeauty incident
        # ("'str' object has no attribute 'get'" reaching a customer).
        env:
          EVENT: ${{ github.event_name }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          set -e
          OVERRIDE=""
          if [ "$EVENT" = "pull_request" ] && printf '%s' "$PR_LABELS" | grep -q '"raw-error-approved"'; then
            OVERRIDE="--override"
          elif git log -1 --format=%B HEAD | grep -q '\[raw-error-approved\]'; then
            OVERRIDE="--override"
          fi
          python backend/scripts/ci_check_raw_exception_leak.py $OVERRIDE

      - name: Machinery-leak copy check (P2, "Show the Outcome, Never the Engine")
        # 2026-08-27 — output-side twin of Guard 22 above: that guard
        # stops a raw EXCEPTION from reaching a user-facing sink; this
        # one stops a hardcoded internal machinery codename/jargon
        # term from being written into user-facing copy in the first
        # place (the bug class behind the "5-adviser council ·
        # chairman verdict" badge found and fixed in this same pass).
        # NOTE: "Vanguard" is deliberately NOT banned — it's the
        # product's own public, marketed feature name.
        env:
          EVENT: ${{ github.event_name }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          set -e
          OVERRIDE=""
          if [ "$EVENT" = "pull_request" ] && printf '%s' "$PR_LABELS" | grep -q '"machinery-copy-approved"'; then
            OVERRIDE="--override"
          elif git log -1 --format=%B HEAD | grep -q '\[machinery-copy-approved\]'; then
            OVERRIDE="--override"
          fi
          python backend/scripts/ci_check_machinery_leak_copy.py $OVERRIDE

      - name: Ship E2E real push proof (P2 item 3, "Show the Outcome, Never the Engine")
        # 2026-08-27 — permanent, standing proof that a real commit
        # lands with the real resolved author identity (not the old
        # generic bot identity). Uses the real GitHub App installation
        # token path against the founder's disposable drill repo
        # (polarisbuiltinc-wq/aurem-rollback-testbed). SKIPS (not
        # fails) with an explicit `app_installation_missing` reason
        # until the founder installs the GitHub App on that repo — at
        # which point it flips to a real green push with zero further
        # code changes. See backend/tests/test_iter2026_08_27_ship_e2e_real_push.py.
        working-directory: backend
        run: python -m pytest tests/test_iter2026_08_27_ship_e2e_real_push.py -v -rs

      - name: Guard — Source-of-truth trip-wires (must never be silently red)
        # W3 · 2026-08 governance ruling — a founder-directed behavior
        # contract test (`@pytest.mark.source_of_truth`) must be its
        # OWN loud, isolated CI signal, never lumped into the general
        # "Run tests" pass/fail count. Root cause this exists: the
        # "Feb 2026 terminal-fail" verify change landed against
        # tests/test_iter309_phase03_self_heal_paused.py without
        # updating it, and it sat silently red inside the wider suite
        # for ~5 weeks because nothing isolated it. if: always() so
        # this signal is never swallowed by an unrelated shard failure
        # above (same pattern as the Coverage ratchet guard step).
        if: always()
        working-directory: backend
        run: python -m pytest -m source_of_truth -v --tb=short --timeout=30

      - name: Guard — Decision-point audit lock (health/coverage/notifier/repo-identity)
        # 2026-09-21 — audit confirmed the deployment health gate,
        # coverage-scan classification, notifier alert routing, and
        # repo-identity/stale-cache validation are all already
        # deterministic (no LLM) — see tests/unit/*_test.py. Same
        # "own loud, isolated CI signal" rationale as the guard above:
        # a future refactor that silently breaks one of these 4
        # already-correct decision points must never get lost inside
        # the wider "Run tests" pass/fail count. if: always() for the
        # same reason.
        if: always()
        working-directory: backend
        run: python -m pytest tests/unit/ -v --tb=short --timeout=30

      - name: Legacy lane (deferred failures — non-blocking)
        # Iter 345 — founder ruling: 259 pre-existing failures
        # (iter36–iter267 era) are quarantined via @pytest.mark.legacy
        # (tests/legacy_quarantine.txt), tracked here, NOT fixed, NOT
        # deleted, and NEVER block this required check.
        if: always()
        continue-on-error: true
        working-directory: backend
        run: |
          python -m pytest -m legacy --tb=no -q --timeout=30 \
            --continue-on-collection-errors \
            --ignore=tests/test_iter138_acceptance_seven.py \
            --ignore=tests/test_iter212m163_aggression_chat.py \
            2>&1 | tee /tmp/legacy_output.txt || true
          mkdir -p ../.emergent
          {
            echo "# Legacy Test Report — deferred failures (founder ruling 2026-07-29)"
            echo ""
            echo "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ) · commit $(git rev-parse --short HEAD)"
            echo "Quarantined nodeids: $(grep -vc '^#' tests/legacy_quarantine.txt)"
            echo ""
            echo '```'
            tail -3 /tmp/legacy_output.txt
            echo '```'
            echo ""
            echo "Full nodeid list: backend/tests/legacy_quarantine.txt"
          } > ../.emergent/legacy-test-report.md

      - name: Upload legacy lane report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-test-report
          path: .emergent/legacy-test-report.md
          retention-days: 14

      - name: Upload merged test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: /tmp/pytest_output.txt
          retention-days: 7


  simulated-user-qa:
    # Directive Session — Promptfoo simulated-user QA (self-hosted).
    # Runs 15 real-persona scenarios against the live backend +
    # orchestrator chain. Gates deploy_gate same as ruff/eslint verify.
    name: Simulated-user QA (promptfoo)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend-tests, backend-tests-aggregate]

    services:
      mongodb:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Directive-mandated self-hosted flags — no Promptfoo Cloud call.
      PROMPTFOO_DISABLE_REMOTE_GENERATION: "true"
      PROMPTFOO_DISABLE_SHARE:              "true"
      PROMPTFOO_DISABLE_TELEMETRY:          "true"
      # Enable QA probe on the CI backend.
      AUREM_QA_MODE:  "true"
      AUREM_QA_TOKEN: "qa-ci-probe-token-must-be-32-chars-min!"
      MONGO_URL:            mongodb://localhost:27017
      DB_NAME:              aurem_qa_ci
      JWT_SECRET:           ci-test-secret-32-chars-minimum!!
      OPENROUTER_API_KEY:   ${{ secrets.OPENROUTER_API_KEY }}
      EMERGENT_LLM_KEY:     ${{ secrets.EMERGENT_LLM_KEY }}
      AUREM_MASTER_KEY: ci-test-master-key-32-chars-long!!
      # CI-only login/rate-limit bypass for the booted server (shared runner IP).
      LOGIN_RATE_PER_MIN: "1000"
      RATE_LIMIT_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: qa/simulated-user/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: |
          # Iter 306 — emergentintegrations is on Emergent's private
          # index (not public PyPI); include --extra-index-url so the
          # GH runner can resolve it.
          pip install -r requirements.txt \
            --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/

      - name: Boot backend in background
        working-directory: backend
        run: |
          uvicorn main:app --host 0.0.0.0 --port 8001 &
          echo $! > /tmp/backend.pid
          for i in {1..60}; do
            curl -sf http://127.0.0.1:8001/health && break
            sleep 1
          done

      - name: Install promptfoo (dev-only)
        working-directory: qa/simulated-user
        run: npm ci --no-audit --no-fund

      - name: Run simulated-user QA suite
        working-directory: qa/simulated-user
        env:
          CI: "true"
        run: bash run.sh

      - name: Stop backend
        if: always()
        run: |
          if [[ -f /tmp/backend.pid ]]; then kill "$(cat /tmp/backend.pid)" || true; fi

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulated-user-qa-report
          path: /tmp/aurem_qa_report.json
          retention-days: 14



  security-scan:
    # G15 (2026-08-20) — was raw pip-audit/yarn-audit with
    # continue-on-error: true, so a fixable HIGH/CRITICAL finding
    # never actually blocked anything. Replaced with the real
    # scripts/g15_dependency_scan.py (allowlist-aware, expiry-checked,
    # persists result to synthetic_checks) and the continue-on-error
    # flag removed — this job now actually gates the build.
    name: Security — Dependency audit (G15)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AUREM_CI_INGEST_TOKEN: ${{ secrets.AUREM_CI_INGEST_TOKEN }}
      AUREM_API_URL:         ${{ vars.AUREM_API_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20 (for yarn audit)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend deps (for yarn audit)
        working-directory: frontend
        run: yarn install --frozen-lockfile || yarn install

      - name: Install pip-audit
        run: pip install pip-audit --quiet

      - name: Guard 15 — dependency CVE scan (blocking)
        working-directory: backend
        run: python scripts/g15_dependency_scan.py


  secret-scan:
    # Iter 212m-120 — Phase 1 of the Vanguard scanner sidecar plan.
    # Runs trufflehog over the full checkout, posts the JSON output
    # to the AUREM backend (/api/aurem-dev/vanguard/ci-findings) so
    # the dashboard can render it next to in-process Vanguard
    # findings, and FAILS the CI run only when at least one VERIFIED
    # secret is detected.  Pattern-only hits warn but don't block —
    # otherwise every fixture/test secret would red-light every PR.
    name: Security — Secret scan (trufflehog)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Iter 306 — hoist secret to job-level env so the step below can
      # gate itself via `env.CI_TOKEN != ''` (secrets context is
      # disallowed inside step-level `if:`).
      CI_TOKEN: ${{ secrets.AUREM_CI_INGEST_TOKEN }}
    steps:
      - name: Checkout (full history for diff scan)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install trufflehog
        run: |
          # Pinned to a stable v3.x — official install script always
          # pulls the latest release and verifies the checksum.
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
            | sh -s -- -b /usr/local/bin
          trufflehog --version

      - name: Run trufflehog filesystem scan
        id: scan
        run: |
          set +e
          # JSON-lines output → parse later in python.
          trufflehog filesystem . \
            --json \
            --no-update \
            --exclude-paths=.trufflehog-exclude \
            > /tmp/trufflehog.jsonl 2>/tmp/trufflehog.err
          EXIT=$?
          # Exit 183 = findings present (trufflehog convention); 0 =
          # clean; anything else = real failure.
          echo "exit_code=$EXIT" >> $GITHUB_OUTPUT
          if [ "$EXIT" != "0" ] && [ "$EXIT" != "183" ]; then
            echo "::warning::trufflehog failed with exit=$EXIT — see stderr"
            cat /tmp/trufflehog.err || true
          fi
          # Always count + classify so the downstream gate has data
          # to act on even if the binary errored mid-run.
          python3 <<'PY'
          import json, os, sys
          rows = []
          try:
              with open("/tmp/trufflehog.jsonl") as fh:
                  for line in fh:
                      line = line.strip()
                      if not line:
                          continue
                      try:
                          rows.append(json.loads(line))
                      except Exception:
                          pass
          except FileNotFoundError:
              pass
          verified   = sum(1 for r in rows if r.get("Verified"))
          unverified = len(rows) - verified
          print(f"Trufflehog scan: total={len(rows)} verified={verified} unverified={unverified}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"total={len(rows)}\n")
              fh.write(f"verified={verified}\n")
              fh.write(f"unverified={unverified}\n")
          # Emit a compact JSON for the next step to POST.
          with open("/tmp/trufflehog.compact.json", "w") as fh:
              json.dump(rows[:2000], fh)
          PY

      - name: Upload trufflehog raw output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trufflehog-jsonl
          path: |
            /tmp/trufflehog.jsonl
            /tmp/trufflehog.err
          retention-days: 7

      - name: Post findings to AUREM dashboard
        if: env.CI_TOKEN != ''
        env:
          API_URL:    ${{ vars.AUREM_API_URL }}
        run: |
          export BASE_URL="${API_URL:-https://auremcto.com}"
          python3 <<'PY'
          import json, os, urllib.request
          with open("/tmp/trufflehog.compact.json") as fh:
              findings = json.load(fh)
          body = {
              "repo":         os.environ["GITHUB_REPOSITORY"],
              "commit":       os.environ["GITHUB_SHA"],
              "branch":       os.environ.get("GITHUB_REF_NAME", ""),
              "scanner":      "trufflehog",
              "findings":     findings,
              "run_url":      f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "triggered_by": os.environ.get("GITHUB_ACTOR", ""),
          }
          url = f"{os.environ['BASE_URL']}/api/aurem-dev/vanguard/ci-findings"
          req = urllib.request.Request(
              url,
              data=json.dumps(body).encode(),
              method="POST",
              headers={
                  "Content-Type":  "application/json",
                  "Authorization": f"Bearer {os.environ['CI_TOKEN']}",
              },
          )
          try:
              resp = urllib.request.urlopen(req, timeout=15)
              print("Ingest OK:", resp.status, resp.read().decode()[:200])
          except Exception as e:
              # Soft-fail the report — never block the deploy gate on
              # a backend hiccup. The verified-secret gate below is
              # the real safety check.
              print(f"::warning::AUREM ingest failed: {e!r}")
          PY

      - name: Fail on verified secrets
        if: steps.scan.outputs.verified != '0'
        run: |
          echo "::error::Trufflehog found ${{ steps.scan.outputs.verified }} VERIFIED secrets — blocking merge."
          echo "Download the 'trufflehog-jsonl' artifact for details, or visit the AUREM dashboard."
          exit 1


  absolute-claim-lint:
    # Trust & Verification round, Enhancement 6 — static scan of
    # user-visible copy/templates for unsupported absolute
    # reliability claims ("100% reliable", "guaranteed", "always
    # works", "never fails", "fully reliable"). Deliberately narrow:
    # CANNOT guarantee arbitrary runtime chat output never makes a
    # claim — that's a separate problem owned by the completion gate
    # (services/verification.py) and output guards, not this job.
    # See backend/scripts/lint_absolute_claims.py's own docstring.
    name: Copy — Absolute-claim lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run absolute-claim lint
        run: python3 backend/scripts/lint_absolute_claims.py


  deploy-gate:
    name: Deploy gate — all checks passed
    needs: [frontend-build, backend-tests, backend-tests-aggregate, simulated-user-qa, security-scan, secret-scan, absolute-claim-lint]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      # "All checks passed" is NOT "deployed". This job used to POST a
      # "success" deploy report to auremcto.com here, which made the
      # dashboard show a deploy that never happened. Deploy results are
      # reported only by AUREM Auto-Deploy, after the `production`
      # environment approval, with the real webhook result.
      - name: All checks passed
        run: |
          echo "✅ Frontend build: passed"
          echo "✅ Backend tests: passed"
          echo "✅ Simulated-user QA: passed"
          echo "✅ Security scan: passed"
          echo "✅ Secret scan:   passed"
          echo "All checks passed. Nothing is deployed by this job."

  # ────────────────────────────────────────────────────────────────
  # Iter 331 — DELETE GATE (see docs/DELETE_GATE.md)
  # tool_executor.py was deleted 3× as "dead code" while lazy-imported,
  # crashing every prod chat tool-call. This job blocks undocumented
  # file deletions:
  #   • Either event: a manual verdict already present (PR description
  #     contains the check-safe-to-delete.sh "Script output:" block,
  #     OR docs/DELETE_GATE.md was updated in the same push/PR head)
  #     short-circuits straight to a pass.
  #   • Otherwise (2026-08-26, extended 2026-09-26 to also cover
  #     pull_request — it used to ONLY get this auto-verdict fallback
  #     on `push`; a `pull_request` run with no "Script output:" text
  #     in the PR body hard-failed immediately even when every deleted
  #     file was provably unreferenced, which is why this job could
  #     show red on `push` and green on `pull_request` — or vice versa
  #     — for the exact same commit, depending on which fallback path
  #     each trigger type was allowed to take) — this job runs
  #     check-safe-to-delete.sh itself and auto-commits the verdict
  #     when every deleted file comes back with ZERO references, so
  #     the audit trail is never skipped by a missed manual step. Any
  #     deletion the script flags as still-referenced STILL fails the
  #     gate for real — this only automates the safe case, it never
  #     rubber-stamps a risky one.
  # ────────────────────────────────────────────────────────────────
  delete-gate:
    name: Delete Gate — dependency-check enforcement
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # PRs need the actual head branch checked out (not the
          # detached merge-commit HEAD actions/checkout@v4 gives by
          # default for pull_request events) so the auto-verdict
          # commit below can be pushed straight back onto it.
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Block undocumented file deletions
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -e
          if [ "$EVENT" = "pull_request" ]; then
            git fetch origin "$BASE_REF" --depth=50 || true
            RANGE="origin/$BASE_REF...HEAD"
            PUSH_REF="$PR_HEAD_REF"
          else
            if [ -z "$BEFORE" ] || echo "$BEFORE" | grep -q '^0*$'; then
              RANGE="HEAD~1..HEAD"
            else
              RANGE="$BEFORE..$SHA"
            fi
            PUSH_REF="${GITHUB_REF#refs/heads/}"
          fi
          DELETED=$(git diff --diff-filter=D --name-only $RANGE 2>/dev/null \
            | grep -Ev '^(_deprecated/)' \
            | grep -Ev '\.(png|jpg|jpeg|svg|log|lock|snap)$' || true)
          if [ -z "$DELETED" ]; then
            echo "No source deletions in $RANGE — gate not applicable."
            exit 0
          fi
          echo "⚠️ Deleted files detected in $RANGE:"
          echo "$DELETED"
          if [ "$EVENT" = "pull_request" ] && printf '%s' "$PR_BODY" | grep -q "Script output:"; then
            echo "✅ PR carries the mandatory check-safe-to-delete.sh output block."
            exit 0
          fi
          if [ "$EVENT" != "pull_request" ] && git diff --name-only $RANGE | grep -q "docs/DELETE_GATE.md"; then
            echo "✅ docs/DELETE_GATE.md verdict record updated in the same push."
            exit 0
          fi

          echo "No manual verdict found — running check-safe-to-delete.sh for each deleted file to auto-verify."
          echo "$DELETED" > /tmp/deleted_files.txt
          ALL_SAFE=1
          {
            echo ""
            echo "## Auto-verdict — $(date -u +%Y-%m-%dT%H:%M:%SZ) — commit \`${SHA:0:9}\`"
            echo "Generated by the delete-gate CI job (2026-08-26 automation, extended"
            echo "2026-09-26 to pull_request) — no manual docs/DELETE_GATE.md edit /"
            echo "PR-description \"Script output:\" block was present, so"
            echo "check-safe-to-delete.sh ran automatically for every deleted file below."
            echo ""
          } > /tmp/verdict_block.md
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            [ "${f##*.}" = "py" ] || [ "${f##*.}" = "jsx" ] || [ "${f##*.}" = "js" ] || [ "${f##*.}" = "ts" ] || [ "${f##*.}" = "tsx" ] || continue
            OUT=$(./scripts/check-safe-to-delete.sh "$f" 2>&1 || true)
            {
              echo "### \`$f\`"
              echo '```'
              echo "$OUT"
              echo '```'
              echo ""
            } >> /tmp/verdict_block.md
            if ! echo "$OUT" | grep -q "✅ ZERO references found"; then
              ALL_SAFE=0
            fi
          done < /tmp/deleted_files.txt

          if [ "$ALL_SAFE" -eq 1 ]; then
            if [ "$EVENT" = "pull_request" ]; then
              echo "✅ Every deleted source file has ZERO remaining references."
              echo "Posting the auto-verdict as a PR comment instead of committing it to the PR branch — a commit here would move the PR's head SHA and cancel the very CI run that produced this verdict."
              exit 0
            fi
            if [ -z "$PUSH_REF" ]; then
              echo "⚠️ Could not resolve a branch ref to push the auto-verdict to (detached/fork PR?) — passing without committing docs/DELETE_GATE.md. Please add the verdict manually."
              cat /tmp/verdict_block.md
              exit 0
            fi
            echo "✅ Every deleted source file has ZERO remaining references — auto-committing the verdict."
            cat /tmp/verdict_block.md >> docs/DELETE_GATE.md
            git config user.name "aurem-delete-gate-bot"
            git config user.email "delete-gate-bot@users.noreply.github.com"
            git add docs/DELETE_GATE.md
            git commit -m "docs: auto-verdict for deletions in ${SHA:0:9} [delete-gate-bot]"
            # GITHUB_TOKEN-authored pushes don't re-trigger push-based
            # workflows (GitHub's own loop guard) — safe to push here.
            # Only reached for non-pull_request pushes (see the `$EVENT
            # = pull_request` branch above): main has no PR pointing at
            # it, so this push can never move a PR head or cancel an
            # in-flight required check.
            git push origin "HEAD:$PUSH_REF"
            exit 0
          fi

          echo "::error::At least one deleted file still has real references — NOT auto-approved. See the check-safe-to-delete.sh output above, investigate, and either restore the file or record a manual verdict in docs/DELETE_GATE.md."
          cat /tmp/verdict_block.md
          exit 1

      - name: Post auto-verdict as a PR comment (pull_request events only)
        # 2026-09-29 — replaces the old "commit docs/DELETE_GATE.md
        # straight to the PR's head branch" side effect. That push moved
        # the PR head SHA, which invalidated required-status-check state
        # pinned to the old SHA and cancelled the in-flight run for this
        # same PR. Posting a comment instead never touches the branch.
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f /tmp/verdict_block.md ]; then
            echo "No verdict block written (gate not applicable or job failed earlier) — nothing to comment."
            exit 0
          fi
          gh pr comment "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --body-file /tmp/verdict_block.md
