# Lock check — requirements resolve + audit (NON-REQUIRED, 2026-11-26 pip fix)
#
# Purpose: prove backend/requirements.txt installs on a clean runner from
# public PyPI only, and report pip-audit findings — WITHOUT blocking merges.
# This workflow is deliberately NOT a required check: pip-audit --strict is
# expected to be red on day one (known CVE pins, e.g. starlette 0.37.2),
# and requiring it now would block every merge. Require it only after it
# passes (separate decision, separate PR).
name: Lock check — requirements resolve + audit

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - backend/requirements.txt
      - backend/requirements-emergent.txt
      - .github/workflows/lock-check.yml

permissions:
  contents: read

jobs:
  pip-resolves:
    name: pip install resolves (public PyPI only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend deps (public PyPI only)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install --dry-run --no-cache-dir -r requirements.txt
          pip install --no-cache-dir -r requirements.txt
          python -c "import fastapi, motor, httpx, jwt; print('import-ok')"

  pip-audit:
    name: pip-audit (strict, advisory only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit backend requirements
        # Nov 2026 (CI-unblock) — header already says advisory-only;
        # make the exit code match. pip-audit --strict is expected red
        # (known CVE pins, e.g. starlette 0.37.2) until pins are bumped
        # (separate decision, separate PR).
        working-directory: backend
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir pip-audit
          pip-audit -r requirements.txt --strict
